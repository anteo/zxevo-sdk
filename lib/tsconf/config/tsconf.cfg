# Source configuration used by tsconf.mk. The library build also emits a
# standalone configuration with resolved CRT and appmake paths.
INCLUDE tools.inc
APPMAKEEXE ${ZX_COMMON_ROOT}/../../tools/appmake/build/z88dk-appmake

CRT0     ${ZX_COMMON_ROOT}/crt/z80_crt0
OPTIONS  -O2 -SO2 -clib=classic -compiler=sdcc --reserve-regs-iy -subtype=none -D__TSCONF -D__Z80 -D__Z80__
CLIB     classic -Cc-standard-escape-chars -ltsconf -lz80_clib -lndos -IDESTDIR/include -LDESTDIR/lib/clibs/z80

# zcc requires whitespace after the name even for an empty subtype.
SUBTYPE  none 
INCLUDE ../../common/config/basic48.cfg
INCLUDE alias.inc
